openapi: 3.1.0
info:
  title: DeucalInt local and collector contract
  version: 0.1.0
  description: Local API on 8100; distributed collector on 8080; distributed read API on 8081. Dashboard endpoints require a cookie session. Distributed endpoints use separately scoped tokens.
servers:
  - url: http://127.0.0.1:8100
paths:
  /v1/batch:
    post:
      summary: Durably enqueue a batch; processing is asynchronous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectToken, events]
              properties:
                projectToken: {type: string}
                deliveryId: {type: string}
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: ../../packages/event-schema/event.schema.json
      responses:
        '202': {description: Persisted in the local inbox or acknowledged by the broker}
        '400': {description: Entire batch rejected because at least one event is invalid}
        '401': {description: Invalid distributed token}
        '403': {description: Invalid local token or disallowed origin}
        '413': {description: Payload exceeds 512 KiB}
        '429': {description: Rate limit exceeded}
        '503': {description: Dependency unavailable; retry the same event IDs}
  /api/login:
    post:
      summary: Create a local-development owner or viewer session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role, password]
              properties:
                role: {enum: [owner, viewer]}
                password: {type: string}
      responses:
        '200': {description: Sets an HttpOnly SameSite=Strict cookie, valid for eight hours}
  /api/overview:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/project'}
        - {$ref: '#/components/parameters/days'}
        - name: segment
          in: query
          schema: {type: string}
          description: URL-encoded JSON segment AST; allowlisted dimensions and operators only
      responses:
        '200': {description: Current metrics, previous-window metrics, time series, pages and dimensions}
  /api/live:
    get:
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/project'}]
      responses:
        '200':
          description: SSE snapshots every two seconds; EventSource reconnects after ten minutes
          content:
            text/event-stream:
              schema: {type: string}
  /api/investigate:
    post:
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/days'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question: {type: string, maxLength: 500}
      responses:
        '200': {description: Evidence, baseline/current windows, correlated contributors, explicit plan, and trace}
  /v1/analytics:
    get:
      servers: [{url: http://127.0.0.1:8081}]
      security: [{readToken: []}]
      parameters: [{$ref: '#/components/parameters/days'}]
      responses:
        '200': {description: ClickHouse JSON result with exact event, visitor, session and error totals}
  /v1/events:
    get:
      servers: [{url: http://127.0.0.1:8081}]
      security: [{readToken: []}]
      responses:
        '200': {description: Scoped events for the dashboard adapter, bounded to 100001 rows}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: di}
    readToken: {type: http, scheme: bearer}
  parameters:
    project: {name: project, in: query, schema: {type: string, default: demo}}
    days: {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
